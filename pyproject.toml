[project]
name = "vacuum-metrics-hub"
version = "0.1.0"
description = "Vendor-agnostic telemetry and predictive maintenance for robot vacuums, via Home Assistant"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "websockets>=12.0",
    "prometheus-client>=0.20",
    "influxdb-client[async]>=1.43",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-PyYAML",
]

[project.scripts]
vmhub = "vmhub.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vmhub"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["influxdb_client.*"]
ignore_missing_imports = true
follow_imports = "skip"

# influxdb-client ships no usable annotations, so its call sites cannot be strict.
[[tool.mypy.overrides]]
module = ["vmhub.exporters.influx"]
disallow_untyped_calls = false
warn_return_any = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
